name: Daily hunter print refresh
# Dry runs get a distinct title so the scheduled fallback never treats them as a real refresh.
run-name: ${{ inputs.dry_run && 'Dry run (dispatch check)' || 'Daily hunter print refresh' }}
on:
  schedule:
    # Fallback only. UTC 10:50 = Asia/Tokyo 19:50, but GitHub may delay scheduled runs by hours.
    # The on-time start comes from Supabase pg_cron calling workflow_dispatch at UTC 10:50.
    - cron: '50 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true: confirm the dispatch path only (no image refresh)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: hunter-print-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Fallback guard: skip only when a real refresh started at or after today's slot (JST 19:50 of the
      # target update date) and succeeded for every card. See tools/hunter-refresh-guard.mjs.
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - name: Skip scheduled fallback if the slot is already covered
        id: guard
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/hunter-refresh-guard.mjs
      - name: Dry run (dispatch path check only)
        if: inputs.dry_run
        run: |
          echo "Dry run - dispatch received at $(date -u +%Y-%m-%dT%H:%M:%SZ). No images were refreshed." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true' && !inputs.dry_run
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true' && !inputs.dry_run
        with:
          node-version: '22'
      - name: Refresh all hunter cards
        if: steps.guard.outputs.skip != 'true' && !inputs.dry_run
        env:
          BAMBI_APP_URL: ${{ vars.BAMBI_APP_URL }}
          HUNTER_REFRESH_SECRET: ${{ secrets.HUNTER_REFRESH_SECRET }}
        run: node tools/refresh-hunter-cards.mjs
